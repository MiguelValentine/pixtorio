name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and upload (leave empty for build only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows/amd64
            artifact: Pixtorio-windows-x64
          - name: macOS ARM64
            runner: macos-14
            platform: darwin/arm64
            artifact: Pixtorio-macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0');
          }
          const config = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
          config.info.productVersion = version;
          fs.writeFileSync('wails.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: npm --prefix frontend run check

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test Go
        run: go test ./...

      - name: Build desktop application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -platform "${{ matrix.platform }}" -s

      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: |
          test -s build/bin/Pixtorio.exe
          mkdir -p release
          cp build/bin/Pixtorio.exe release/Pixtorio-windows-x64.exe

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          test -x build/bin/Pixtorio.app/Contents/MacOS/Pixtorio
          lipo build/bin/Pixtorio.app/Contents/MacOS/Pixtorio -verify_arch arm64
          codesign --force --deep --sign - build/bin/Pixtorio.app
          codesign --verify --deep --strict build/bin/Pixtorio.app
          mkdir -p release
          mkdir -p build/dmg
          ditto build/bin/Pixtorio.app build/dmg/Pixtorio.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Pixtorio -srcfolder build/dmg -format UDZO -ov release/Pixtorio-macos-arm64.dmg
          hdiutil verify release/Pixtorio-macos-arm64.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Pixtorio-*
          merge-multiple: true
          path: release

      - name: Create draft and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          test -s release/Pixtorio-windows-x64.exe
          test -s release/Pixtorio-macos-arm64.dmg
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            if [ "$draft" != "true" ]; then
              gh release upload "$RELEASE_TAG" release/*
            else
              gh release upload "$RELEASE_TAG" release/* --clobber
            fi
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag --draft --generate-notes --title "Pixtorio $RELEASE_TAG"
          fi
